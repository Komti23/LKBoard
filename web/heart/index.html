<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>♥</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff3366'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060709;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient background gradient glow */
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255, 45, 85, 0.16) 0%, rgba(255, 45, 85, 0.04) 45%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      filter: blur(40px);
      animation: ambientPulse 4s ease-in-out infinite;
      will-change: transform, opacity;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .heart-stage {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .heart-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      animation: heartbeat 1.4s cubic-bezier(0.21, 0.85, 0.42, 1) infinite;
      will-change: transform;
      transition: filter 0.3s ease;
    }

    .heart-wrapper:hover {
      animation-duration: 1.05s;
    }

    .heart-svg {
      width: 100%;
      height: 100%;
      fill: url(#heart-grad);
      filter: drop-shadow(0 10px 30px rgba(255, 45, 85, 0.55))
              drop-shadow(0 0 60px rgba(255, 64, 105, 0.25));
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .heart-wrapper:active .heart-svg {
      transform: scale(0.88);
    }

    /* Subtle ripple ring on pulse */
    .pulse-ring {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 51, 102, 0.4);
      opacity: 0;
      pointer-events: none;
      animation: ringSpread 1.4s cubic-bezier(0.1, 0.7, 0.1, 1) infinite;
    }

    .pulse-ring.ring-2 {
      animation-delay: 0.15s;
    }

    @keyframes heartbeat {
      0% {
        transform: scale(1);
      }
      14% {
        transform: scale(1.15);
      }
      28% {
        transform: scale(1.03);
      }
      42% {
        transform: scale(1.22);
      }
      70% {
        transform: scale(1);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes ambientPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.25);
        opacity: 1;
      }
    }

    @keyframes ringSpread {
      0% {
        transform: scale(0.8);
        opacity: 0.8;
      }
      35% {
        opacity: 0.5;
      }
      100% {
        transform: scale(2.6);
        opacity: 0;
      }
    }

    /* Tap hint note that fades away */
    .hint {
      position: absolute;
      bottom: 40px;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.22);
      pointer-events: none;
      transition: opacity 1s ease;
      font-weight: 400;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>
  <canvas id="particleCanvas"></canvas>

  <div class="heart-stage" id="stage">
    <div class="pulse-ring"></div>
    <div class="pulse-ring ring-2"></div>
    <div class="heart-wrapper" id="heart">
      <svg class="heart-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4b72" />
            <stop offset="50%" stop-color="#ff1a4d" />
            <stop offset="100%" stop-color="#d60036" />
          </linearGradient>
        </defs>
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </div>
  </div>

  <div class="hint" id="hint">touch / click</div>

  <script>
    // Canvas Particles
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const colors = ['#ff3366', '#ff5983', '#ff8da7', '#ff1a4d', '#ffffff'];

    class Particle {
      constructor(x, y, isBurst = false) {
        this.x = x ?? Math.random() * width;
        this.y = y ?? (height + 20);
        this.isBurst = isBurst;
        
        if (isBurst) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 5;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed - 2;
          this.size = 2.5 + Math.random() * 4.5;
          this.alpha = 1;
          this.decay = 0.012 + Math.random() * 0.02;
          this.isHeartShape = Math.random() > 0.4;
        } else {
          this.vx = (Math.random() - 0.5) * 0.6;
          this.vy = -(0.4 + Math.random() * 0.9);
          this.size = 1.2 + Math.random() * 2.2;
          this.alpha = 0.15 + Math.random() * 0.45;
          this.decay = 0.002 + Math.random() * 0.003;
          this.isHeartShape = Math.random() > 0.75;
        }
        
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.05;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.rotationSpeed;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = this.isBurst ? 10 : 4;

        if (this.isHeartShape) {
          // Draw tiny heart
          const s = this.size;
          ctx.beginPath();
          ctx.moveTo(0, s * 0.3);
          ctx.bezierCurveTo(-s * 0.6, -s * 0.4, -s * 1.2, s * 0.3, 0, s * 1.3);
          ctx.bezierCurveTo(s * 1.2, s * 0.3, s * 0.6, -s * 0.4, 0, s * 0.3);
          ctx.fill();
        } else {
          // Soft glowing orb
          ctx.beginPath();
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    // Ambient floating background particles
    function spawnAmbient() {
      if (particles.length < 50 && Math.random() < 0.35) {
        particles.push(new Particle());
      }
    }

    function burst(x, y, count = 22) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, true));
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      spawnAmbient();

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        if (p.alpha <= 0 || p.y < -20 || p.x < -20 || p.x > width + 20) {
          particles.splice(i, 1);
        } else {
          p.draw();
        }
      }

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // Interactive clicks & taps
    const stage = document.getElementById('stage');
    const hint = document.getElementById('hint');
    let hasInteracted = false;

    function handleInteraction(clientX, clientY) {
      if (!hasInteracted) {
        hasInteracted = true;
        if (hint) {
          hint.style.opacity = '0';
          setTimeout(() => hint.remove(), 1000);
        }
      }
      burst(clientX, clientY, 26);
    }

    stage.addEventListener('click', (e) => {
      handleInteraction(e.clientX, e.clientY);
    });

    window.addEventListener('click', (e) => {
      if (e.target !== stage && !stage.contains(e.target)) {
        handleInteraction(e.clientX, e.clientY);
      }
    });

    window.addEventListener('touchstart', (e) => {
      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        handleInteraction(t.clientX, t.clientY);
      }
    }, { passive: true });
  </script>
</body>
</html>
